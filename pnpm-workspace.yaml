packages:
  - apps/*
  - packages/*

overrides:
  h3: 1.15.11
  fastify: 5.12.5
  vue: 3.5.43
  vue-router: 5.3.1
  vue-i18n: 11.4.12
  "@intlify/shared": 11.4.12
  "@intlify/core-base": 11.4.12
  "@intlify/devtools-types": 11.4.12

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalog:
  typescript: ^6.0.3
  "@types/node": ^26.6.1
  nuxt: ^4.5.2
  vue: ^3.5.43
  vue-router: ^5.3.1
  vue-i18n: ^11.4.12
  "@nuxt/ui": ^4.11.1
  "@nuxtjs/i18n": ^10.6.0
  vue-tsc: ^3.3.11
  "@iconify-json/fluent": ^1.2.58
  "@iconify-json/lucide": ^1.2.133
  evlog: ^2.29.0
  "@nestjs/common": ^12.0.3
  "@nestjs/core": ^12.0.3
  "@nestjs/platform-fastify": ^12.0.3
  "@nestjs/testing": ^12.0.3
  "@mikro-orm/cli": ^7.2.0
  "@mikro-orm/core": ^7.2.0
  "@mikro-orm/decorators": ^7.2.0
  "@mikro-orm/migrations": ^7.2.0
  "@mikro-orm/postgresql": ^7.2.0
  "@mikro-orm/seeder": ^7.2.0

minimumReleaseAgeExclude:
  - vue
  - "@vue/*"
  - "@nestjs/throttler"
