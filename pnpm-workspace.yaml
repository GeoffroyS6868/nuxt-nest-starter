packages:
  - apps/*
  - packages/*

overrides:
  h3: 1.15.11
  fastify: 5.12.5
  vue: 3.5.43
  vue-router: 5.4.0
  vue-i18n: 11.4.14
  "@intlify/shared": 11.4.14
  "@intlify/core-base": 11.4.14
  "@intlify/devtools-types": 11.4.14
  "fontless>esbuild": 0.28.2

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalog:
  # NestJS, vue-tsc and ts-jest require the TypeScript 6 compiler API.
  typescript: ^6.0.3
  "@types/node": ^26.6.5
  nuxt: ^4.6.1
  vue: ^3.5.43
  vue-router: ^5.4.0
  vue-i18n: ^11.4.14
  "@nuxt/ui": ^4.11.3
  "@nuxtjs/i18n": ^10.6.0
  vue-tsc: ^3.3.13
  "@iconify-json/fluent": ^1.2.59
  "@iconify-json/lucide": ^1.2.142
  evlog: ^2.30.1
  "@nestjs/common": ^12.1.2
  "@nestjs/core": ^12.1.2
  "@nestjs/platform-fastify": ^12.1.2
  "@nestjs/testing": ^12.1.2
  "@mikro-orm/cli": ^7.2.5
  "@mikro-orm/core": ^7.2.5
  "@mikro-orm/decorators": ^7.2.5
  "@mikro-orm/migrations": ^7.2.5
  "@mikro-orm/postgresql": ^7.2.5
  "@mikro-orm/seeder": ^7.2.5

minimumReleaseAgeExclude:
  - vue
  - "@vue/*"
  - "@nestjs/throttler"
