packages:
  - apps/*
  - packages/*

overrides:
  h3: 1.15.11
  fastify: 5.12.8
  vue: 3.5.46
  vue-router: 5.5.1
  vue-i18n: 11.4.23
  "@intlify/shared": 11.4.23
  "@intlify/core-base": 11.4.23
  "@intlify/devtools-types": 11.4.23
  "fontless>esbuild": 0.28.2
  "archiver>readdir-glob": 4.0.0
  "@swc/cli>minimatch": 11.0.9

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalog:
  # NestJS and vue-tsc require the TypeScript 6 compiler API.
  typescript: ^6.0.3
  "@types/node": ^26.6.6
  nuxt: ^4.6.4
  vue: ^3.5.46
  vue-router: ^5.5.1
  vue-i18n: ^11.4.23
  "@nuxt/ui": ^4.13.0
  "@nuxtjs/i18n": ^10.6.0
  vue-tsc: ^3.3.14
  "@iconify-json/fluent": ^1.2.62
  "@iconify-json/lucide": ^1.2.158
  evlog: ^2.37.1
  "@nestjs/common": ^12.6.0
  "@nestjs/core": ^12.6.0
  "@nestjs/platform-fastify": ^12.6.0
  "@nestjs/testing": ^12.6.0
  "@mikro-orm/cli": ^7.2.11
  "@mikro-orm/core": ^7.2.11
  "@mikro-orm/decorators": ^7.2.11
  "@mikro-orm/migrations": ^7.2.11
  "@mikro-orm/postgresql": ^7.2.11
  "@mikro-orm/seeder": ^7.2.11

minimumReleaseAgeExclude:
  - vue
  - "@vue/*"
  - "@nestjs/throttler"
